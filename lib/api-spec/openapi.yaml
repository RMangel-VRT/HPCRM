openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mobile-auth
    description: Mobile bearer-token auth (Slice 0)
  - name: crews
    description: Field crews administration
  - name: mobile-today
    description: Mobile Today screen (Slice 1)
  - name: mobile-ticket
    description: Mobile ticket detail / work items / complete (Slice 2)
  - name: service-type-templates
    description: Admin-managed reusable work-item templates (Slice 2)
  - name: ticket-work-items
    description: Per-ticket work items administered from the web CRM (Slice 2)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /m/auth/login:
    post:
      operationId: mobileLogin
      tags: [mobile-auth]
      summary: Exchange username/password for a mobile bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSession"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User does not hold a mobile-eligible role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/auth/logout:
    post:
      operationId: mobileLogout
      tags: [mobile-auth]
      summary: Revoke the bearer token used for the current request
      security:
        - mobileBearer: []
      responses:
        "204":
          description: Token revoked
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/me:
    get:
      operationId: mobileMe
      tags: [mobile-auth]
      summary: Return the authenticated mobile user
      security:
        - mobileBearer: []
      responses:
        "200":
          description: The current user, scoped to their active company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileUser"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Membership is no longer active or role no longer permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/me/week:
    get:
      operationId: mobileMeWeek
      tags: [mobile-auth]
      summary: 7-day stop rollup for the supervisor's crew
      security:
        - mobileBearer: []
      parameters:
        - in: query
          name: startDate
          required: false
          schema: { type: string, description: "YYYY-MM-DD; defaults to today" }
      responses:
        "200":
          description: Day-by-day totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileWeekResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Mobile access disallowed for this role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /m/me/recent-completions:
    get:
      operationId: mobileMeRecentCompletions
      tags: [mobile-auth]
      summary: Recently completed stops for the supervisor's crew
      security:
        - mobileBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Recent completions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileRecentCompletionsResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Mobile access disallowed for this role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /m/me/notification-prefs:
    patch:
      operationId: mobileMeUpdateNotificationPrefs
      tags: [mobile-auth]
      summary: Update per-event push opt-ins
      security:
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileNotificationPrefs" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  notificationPrefs:
                    $ref: "#/components/schemas/MobileNotificationPrefs"
                required: [ok, notificationPrefs]
        "400":
          description: Invalid prefs body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /m/me/push-subscriptions:
    post:
      operationId: mobileMeAddPushSubscription
      tags: [mobile-auth]
      summary: Register an Expo push token for this device
      security:
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobilePushSubscriptionRequest" }
      responses:
        "200":
          description: Token registered (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "400":
          description: Invalid Expo push token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: mobileMeRemovePushSubscription
      tags: [mobile-auth]
      summary: Remove an Expo push token from this user
      security:
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobilePushUnsubscribeRequest" }
      responses:
        "200":
          description: Token removed (no-op if missing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "400":
          description: Missing token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /m/today:
    get:
      operationId: mobileToday
      tags: [mobile-today]
      summary: Today's stops for the authenticated supervisor's crew
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Today schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileToday"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/tickets/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mobileStartTicket
      tags: [mobile-today]
      summary: Mark a ticket as in-progress (idempotent)
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Updated stop status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketStatus"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not assigned to a crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found for this crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: mobileTicketDetail
      tags: [mobile-ticket]
      summary: Ticket detail with curated site notes and work items
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketDetail"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not assigned to a crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found for this crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/tickets/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: mobileCompleteTicket
      tags: [mobile-ticket]
      summary: Mark a ticket complete; soft-confirms when required items are missing
      security:
        - mobileBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileCompleteRequest"
      responses:
        "200":
          description: Ticket marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketCompletion"
        "409":
          description: "Required work items are missing; resubmit with acknowledgedMissingRequired=true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileMissingRequiredResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not assigned to a crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found for this crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /m/work-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: mobilePatchWorkItem
      tags: [mobile-ticket]
      summary: Toggle a work item complete or set a skip reason
      security:
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileWorkItemPatch"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWorkItem"
        "401":
          description: Missing or invalid token
        "403":
          description: Caller is not assigned to a crew
        "404":
          description: Work item not found for this crew
        "422":
          description: Photo required before completing this work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobilePhotoRequiredResponse"
  /m/tickets/{id}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: mobileListTicketPhotos
      tags: [mobile-ticket]
      summary: List photos uploaded by the crew for this ticket
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Photos with short-lived signed URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MobileTicketPhoto"
    post:
      operationId: mobileUploadTicketPhoto
      tags: [mobile-ticket]
      summary: Upload a single processed JPEG / PNG / WebP / HEIC photo
      description: |
        Preferred form: `multipart/form-data` with a single binary `file` field
        (per OpenAPI conventions). The server also accepts a raw image body
        (one of the `image/*` content types or `application/octet-stream`) as
        a low-overhead fallback for the mobile upload queue, which avoids the
        cost of building a multipart body on-device. Both forms are subject
        to the same 10 MB cap and validated by magic-byte sniffing.
      security:
        - mobileBearer: []
      parameters:
        - name: X-Client-Id
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
          description: Idempotency key from the upload queue (uuid).
        - name: X-Captured-At
          in: header
          required: false
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file (JPEG, PNG, WebP, or HEIC).
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/heic:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Photo created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketPhoto"
        "200":
          description: Idempotent — existing photo returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketPhoto"
        "400": { description: Empty body }
        "415": { description: Unsupported file type }
        "422": { description: Could not process photo }
  /m/photos/{photoId}:
    parameters:
      - name: photoId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: mobileDeleteTicketPhoto
      tags: [mobile-ticket]
      summary: Delete a photo (uploader only)
      security:
        - mobileBearer: []
      responses:
        "204": { description: Deleted }
        "403": { description: Not the uploader }
        "404": { description: Not found }
  /m/tickets/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: mobileListTicketNotes
      tags: [mobile-ticket]
      summary: List free-text notes the crew added to this ticket
      security:
        - mobileBearer: []
      responses:
        "200":
          description: Notes (chronological)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MobileTicketNote"
    post:
      operationId: mobileCreateTicketNote
      tags: [mobile-ticket]
      summary: Add a free-text note
      security:
        - mobileBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTicketNoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketNote"
        "200":
          description: Idempotent — existing note returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTicketNote"
  /m/notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: mobileDeleteTicketNote
      tags: [mobile-ticket]
      summary: Delete a note (author only)
      security:
        - mobileBearer: []
      responses:
        "204": { description: Deleted }
        "403": { description: Not the author }
        "404": { description: Not found }
  /service-type-templates:
    get:
      operationId: listServiceTypeTemplates
      tags: [service-type-templates]
      summary: List service-type templates for the active company
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceTypeTemplate"
    post:
      operationId: createServiceTypeTemplate
      tags: [service-type-templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTypeTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTypeTemplate"
  /service-type-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateServiceTypeTemplate
      tags: [service-type-templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTypeTemplateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTypeTemplate"
        "404":
          description: Not found
    delete:
      operationId: deleteServiceTypeTemplate
      tags: [service-type-templates]
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /tickets/{id}/work-items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTicketWorkItems
      tags: [ticket-work-items]
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWorkItem"
    post:
      operationId: createTicketWorkItem
      tags: [ticket-work-items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketWorkItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWorkItem"
  /tickets/{ticketId}/work-items/{id}:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTicketWorkItem
      tags: [ticket-work-items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketWorkItemPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWorkItem"
        "404":
          description: Not found
    delete:
      operationId: deleteTicketWorkItem
      tags: [ticket-work-items]
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /tickets/{id}/work-items/load-template:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: loadTicketWorkItemsFromTemplate
      tags: [ticket-work-items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadTemplateRequest"
      responses:
        "201":
          description: Inserted work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWorkItem"
        "404":
          description: Template or ticket not found
  /crews:
    get:
      operationId: listCrews
      tags: [crews]
      summary: List crews for the active company
      responses:
        "200":
          description: Crews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrewWithSupervisor"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (admin/office only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCrew
      tags: [crews]
      summary: Create a crew
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewInput"
      responses:
        "201":
          description: Crew created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "400":
          description: Invalid input or supervisor not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate crew name in this company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /crews/eligible-supervisors:
    get:
      operationId: listEligibleCrewSupervisors
      tags: [crews]
      summary: List users in this company eligible to be a crew supervisor
      responses:
        "200":
          description: Eligible supervisors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligibleSupervisor"
  /crews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateCrew
      tags: [crews]
      summary: Update a crew
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrewPatch"
      responses:
        "200":
          description: Updated crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate crew name in this company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCrew
      tags: [crews]
      summary: Delete a crew
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Role:
      type: string
      enum:
        - admin
        - office
        - field_manager
        - chemical_manager
        - field
        - irrigation_manager
        - shop_manager
        - mapping
        - landscape_supervisor
        - crew_supervisor
    MobileLoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        deviceLabel:
          type: string
          maxLength: 120
      required: [username, password]
    MobileUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        language:
          type: string
          enum: [en, es]
          nullable: true
        activeCompanyId: { type: string }
        activeRole:
          $ref: "#/components/schemas/Role"
        isSuperAdminBool:
          type: boolean
        crewId:
          type: string
          nullable: true
          description: Active crew ID when the user supervises one (Slice 6+).
        crewName:
          type: string
          nullable: true
        notificationPrefs:
          $ref: "#/components/schemas/MobileNotificationPrefs"
        pushDeviceCount:
          type: integer
          minimum: 0
          description: Number of Expo push tokens currently registered for this user.
      required: [id, name, activeCompanyId, activeRole]
    MobileNotificationPrefs:
      type: object
      properties:
        newTicketAssignment: { type: boolean }
        ticketReassignment: { type: boolean }
        flagResponse: { type: boolean }
      required: [newTicketAssignment, ticketReassignment, flagResponse]
    MobileWeekDay:
      type: object
      properties:
        date: { type: string, description: "YYYY-MM-DD (server-local)" }
        total: { type: integer, minimum: 0 }
        complete: { type: integer, minimum: 0 }
        flagged: { type: integer, minimum: 0 }
      required: [date, total, complete, flagged]
    MobileWeekResponse:
